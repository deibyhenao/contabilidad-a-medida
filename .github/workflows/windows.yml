name: Windows · pruebas e instalador

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Suite completa sin API real ni datos de clientes
        run: python -m pytest -q --tb=short --junitxml=build/pruebas.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-windows
          path: build/pruebas.xml

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validar
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Comprobar versión del tag
        env:
          TAG_PUBLICACION: ${{ github.ref_name }}
        run: python -c "import os; from version import VERSION; assert os.environ['TAG_PUBLICACION'] == 'v'+VERSION, 'El tag debe coincidir con version.py'"
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Construir y diagnosticar ejecutable e instalador
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/build_release.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: release/*
          if-no-files-found: error
      - name: Publicar release estable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_PUBLICACION: ${{ github.ref_name }}
        run: gh release create "$env:TAG_PUBLICACION" release/*.exe release/SHA256SUMS.txt --verify-tag --title "Contabilidad a Medida $env:TAG_PUBLICACION" --generate-notes
