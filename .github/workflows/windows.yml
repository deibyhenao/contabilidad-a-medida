name: Windows · pruebas e instalador

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar instalador de la versión de version.py después de validar'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: windows-latest
    # La suite con estrés de 600 expedientes llegó a 96 minutos en Windows local.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Suite completa sin API real ni datos de clientes
        run: python -m pytest -q --tb=short --junitxml=build/pruebas.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-windows
          path: build/pruebas.xml

  publicar:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    needs: validar
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Comprobar versión del tag
        id: version
        env:
          TAG_PUBLICACION: ${{ github.ref_name }}
        run: |
          python -c "import os,re; from version import VERSION; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', VERSION); tag='v'+VERSION; assert not os.environ['GITHUB_REF'].startswith('refs/tags/') or os.environ['TAG_PUBLICACION']==tag, 'El tag debe coincidir con version.py'; open(os.environ['GITHUB_OUTPUT'],'a').write('tag='+tag+'\n')"
      - name: Comprobar si la versión ya está publicada
        id: release_existente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_PUBLICACION: ${{ steps.version.outputs.tag }}
        run: python scripts/verificar_release.py
      - if: steps.release_existente.outputs.existe == 'false'
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Construir y diagnosticar ejecutable e instalador
        if: steps.release_existente.outputs.existe == 'false'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/build_release.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: steps.release_existente.outputs.existe == 'false'
        with:
          name: instalador-windows
          path: release/*
          if-no-files-found: error
      - name: Publicar release estable
        if: steps.release_existente.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_PUBLICACION: ${{ steps.version.outputs.tag }}
          COMMIT_PUBLICACION: ${{ github.sha }}
        run: |
          # Otra publicación puede terminar mientras se construye: conservarla.
          $existe = python scripts/verificar_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existe -eq 'true') {
            Write-Host 'Esta versión ya está publicada. Se conservan sus archivos.'
            exit 0
          }
          gh release create "$env:TAG_PUBLICACION" (Get-ChildItem -LiteralPath release -Filter '*.exe' -File).FullName release/SHA256SUMS.txt --target "$env:COMMIT_PUBLICACION" --title "Contabilidad a Medida $env:TAG_PUBLICACION" --generate-notes
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            # Resolver la carrera entre dos publicadores sin sustituir archivos.
            $publicada = python scripts/verificar_release.py
            if ($LASTEXITCODE -eq 0 -and $publicada -eq 'true') {
              Write-Host 'Otra ejecución ya publicó la versión. Se conserva.'
              exit 0
            }
            exit $codigo
          }
      - name: Conservar release ya publicada
        if: steps.release_existente.outputs.existe == 'true'
        run: Write-Host 'La versión ya existe y se ha verificado. No se recompila ni se sustituye. Para cambios de la app, usa una versión nueva.'
